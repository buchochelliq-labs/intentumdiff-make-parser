[package]
name = "tree-sitter-make"
version = "1.1.1"
edition = "2021"
license = "MIT"
# Patched: parser.c pre-compiled to lib/libtree_sitter_make.a for wasm32-wasip2
# (zig cc, see docs/WASM_BUILD_PATCHES.md) - the upstream build script invokes cc
# at build time, which fails without a WASI C compiler and under Windows AppControl.
# Native (host) builds still compile the C source directly. No scanner.c.
build = "build.rs"
autolib = false

[lib]
name = "tree_sitter_make"
path = "bindings/rust/lib.rs"

[dependencies.tree-sitter-language]
version = "0.1"

[build-dependencies]
cc = "1"
